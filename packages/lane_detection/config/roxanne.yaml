# ECEN 433 - Lab 4

image_topic: "camera_node/image/compressed"

img_size: [640, 480]
top_cutoff: 0.45

colors:
  WHITE:
    low:  [0, 0, 160]
    high: [179, 80, 255]

  YELLOW:
    low:  [15, 80, 80]
    high: [40, 255, 255]

  RED:
    low_1:  [0, 100, 80]
    high_1: [10, 255, 255]
    low_2:  [170, 100, 80]
    high_2: [179, 255, 255]

dilation_kernel_size: 3
erode_iterations: 1
dilate_iterations: 2

canny_thresholds: [80, 160]
canny_aperture_size: 3

hough:
  threshold: 15
  min_line_length: 12
  max_line_gap: 8

normal_probe_px: 2

fake_lane_filter_switch: false