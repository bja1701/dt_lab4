# ECEN 433 - Lab 4
#
# Detector configuration for gru (the real robot). Loaded by
# lane_following.launch. Test mode (camera_sim) uses lane_detection_test.yaml.

image_topic: "camera_node/image/compressed"
 
img_size: [320, 240]   # half res to save CPU (was 640x480)
process_every: 2       # use every 2nd camera frame (30 Hz -> 15 Hz)
top_cutoff: 0.45       # was 0.65 to dodge CPU overload; 0.45 sees tight inside turns sooner

colors:
  WHITE:
    low:  [0, 0, 140]
    high: [179, 60, 255]
    # low:  [90, 10, 150]
    # high: [130, 110, 255]
 
  YELLOW:
    low:  [15, 50, 100]
    high: [45, 255, 255]
 
  RED:
    low_1:  [150, 50, 100]
    high_1: [179, 200, 255]
    low_2:  [0, 0, 0]
    high_2: [10, 20, 60]
 
dilation_kernel_size: 3
erode_iterations: 1      # halved with the image size (was 2)
dilate_iterations: 2     # allow mask to reach canny edges (was 4 at 640x480)
 
canny_thresholds: [60, 120]
canny_aperture_size: 3
hough:
  threshold: 15
  min_line_length: 8   # pixels, halved with the image (was 15)
  max_line_gap: 4      # (was 8)
 
normal_probe_px: 2

# Leave this false.
fake_lane_filter_switch: false
